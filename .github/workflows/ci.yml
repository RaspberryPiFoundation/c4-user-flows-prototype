name: Build

# A broken prototype should be caught in the pull request, not on the live
# site — one prototype that does not compile stops the whole site deploying.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-checks and builds. There are no unit tests, on purpose: this repo
      # makes throwaway UI, and tests on it would be wasted effort.
      - name: Build
        run: npm run build
